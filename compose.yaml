version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: seminovos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      LOG_DIR: /app/logs
    secrets:
      - google_service_account
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PUBLISHED_PORT:-5000}:5000"
    volumes:
      - seminovos_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

secrets:
  google_service_account:
    file: ${SERVICE_ACCOUNT_SECRET_FILE:-./secrets/google-service-account.json}

volumes:
  seminovos_logs:
