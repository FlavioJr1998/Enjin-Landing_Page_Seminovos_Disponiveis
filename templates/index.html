<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Agenda Das Oficinas Honda Enjin</title>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="revisit-after" content="1 minute">

    <meta name="description"
        content="Agenda online de horários disponíveis da oficina Honda Enjin para atendimento e agendamento de serviços.">

    <meta name="keywords" content="agenda oficina,honda,enjin,agendamento,serviços,revisão,oficina">

    <meta name="author" content="Enjin Tecnologia">

    <meta name="robots" content="index,follow">

    <link rel="canonical" href="https://agendaoficina.enjin.app.br/">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script type="application/ld+json">
        {
            "@context":"https://schema.org",
            "@type":"WebPage",

            "name":"Agenda Oficina Honda Enjin",

            "description":"Página que apresenta os horários disponíveis para agendamento da oficina.",

            "url":"https://agendaoficina.enjin.app.br",

            "inLanguage":"pt-BR",

            "publisher":{
                "@type":"Organization",
                "name":"Enjin Tecnologia"
            }
        }
    </script>
</head>

<body>

    <h1>Agenda Oficina</h1>

    <table>

        <thead>

            <tr>

                <th>Data</th>

                <th>Cidade</th>

                <th>Horário</th>

                <th>Capacidade</th>

                <th>Agendados</th>

                <th>Status</th>

            </tr>

        </thead>

        <tbody>

            {% for item in dados %}

            <tr>

                <td>{{ item.DATA }}</td>

                <td>{{ item.CIDADE }}</td>

                <td>{{ item.HORA_INICIO }}</td>

                <td>{{ item.CAPACIDADE_MAX }}</td>

                <td>{{ item.AGENDADOS }}</td>

                <td class="{{ item.STATUS | lower }}">

                    {{ item.STATUS }}

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
